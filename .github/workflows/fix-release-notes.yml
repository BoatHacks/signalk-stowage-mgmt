name: Fix Release Notes

# One-off utility to re-set an existing release's body from CHANGELOG.md,
# for cases where the body was published with mangled content (e.g. the
# v0.9.4 release initially lost all backtick-quoted text because Cut
# Release spliced the notes into a shell command string before the fix in
# the same commit that added this workflow).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version whose release notes should be re-set, e.g. 0.9.4 (no leading v)'
        required: true

permissions:
  contents: write

jobs:
  fix-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          START=$(grep -n "^## \[$VERSION\]" CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$START" ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION"
            exit 1
          fi
          REST=$(tail -n +$((START+1)) CHANGELOG.md)
          END=$(printf '%s\n' "$REST" | grep -n "^## \[" | head -1 | cut -d: -f1)
          if [ -z "$END" ]; then
            NOTES="$REST"
          else
            NOTES=$(printf '%s\n' "$REST" | head -n $((END-1)))
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          gh release edit "$TAG" --notes "$NOTES"
