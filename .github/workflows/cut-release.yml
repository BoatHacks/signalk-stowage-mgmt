name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.9.4 (no leading v) — must match package.json and have a dated CHANGELOG.md entry'
        required: true
      ref:
        description: 'Branch or commit to release from'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Verify package.json version matches input
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match requested version (${{ github.event.inputs.version }})"
            exit 1
          fi

      - name: Ensure tag does not already exist
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

      # Pulls out everything between this version's "## [x.y.z]" heading and
      # the next "## [" heading, for use as the release body.
      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          START=$(grep -n "^## \[$VERSION\]" CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$START" ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION"
            exit 1
          fi
          REST=$(tail -n +$((START+1)) CHANGELOG.md)
          END=$(printf '%s\n' "$REST" | grep -n "^## \[" | head -1 | cut -d: -f1)
          if [ -z "$END" ]; then
            NOTES="$REST"
          else
            NOTES=$(printf '%s\n' "$REST" | head -n $((END-1)))
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Tag release
        run: |
          TAG="v${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "${{ steps.changelog.outputs.notes }}"
